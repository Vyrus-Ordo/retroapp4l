services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.dev
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      # Bind mount: alterações no código refletem imediatamente no container
      - ./backend:/app
    networks:
      - internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
      NUXT_PUBLIC_WS_BASE: ws://localhost:8000/ws
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      # Bind mount do código para hot reload
      - ./frontend:/app
      # Preserva o node_modules instalado na imagem
      # sem isso o bind mount sobrescreve a pasta e quebra
      - /app/node_modules
    networks:
      - internal

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retroapp4l
      POSTGRES_USER: retroapp4l
      POSTGRES_PASSWORD: retroapp4l
    healthcheck:
      # Usado por `run` do serviço tests: garante que o Postgres
      # aceita conexões antes de o pytest criar o banco de teste
      test: ["CMD-SHELL", "pg_isready -U retroapp4l -d retroapp4l"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      # Exposto no host para conectar com DBeaver, TablePlus etc.
      # 5433 no host porque 5432 já está ocupada pelo container
      # compartilhado postgres-pgvector (infra/postgres_pgvector)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  # Suíte backend (pytest-django) em container descartável.
  # Comando canônico: docker compose -f docker-compose.dev.yml run --rm tests
  # Reaproveita a MESMA imagem do serviço backend (mesmo build/Dockerfile,
  # sem pip install duplicado); o exit code do container é o do pytest, então
  # `run --rm tests` retorna != 0 quando a suíte falha.
  # O --junitxml=reports/junit.xml vem do backend/pytest.ini (addopts).
  tests:
    # Perfil "tools": não sobe no `up -d` (é run-once); só roda quando
    # chamado explicitamente com `docker compose ... run --rm tests`.
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: retroapp4l-backend
    env_file:
      - ./backend/.env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["pytest"]
    volumes:
      # Mesmo bind mount do backend: testa o código atual sem rebuild
      - ./backend:/app
      # reports/junit.xml fica no host após o run
      - ./backend/reports:/app/reports
    networks:
      - internal

  redis:
    image: redis:7-alpine
    ports:
      # Exposto no host para inspecionar com redis-cli ou RedisInsight
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge