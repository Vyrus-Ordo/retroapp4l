[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
# Relatório JUnit consumido pelo serviço `tests` do docker-compose.dev.yml
# (./backend/reports/junit.xml no host). O pytest cria o diretório se faltar.
addopts = --junitxml=reports/junit.xml
# Modo "strict": só os testes marcados explicitamente com @pytest.mark.asyncio
# rodam no event loop. É o modo mínimo aqui — os testes de tests/realtime/
# já trazem o marcador, então nada neles precisa mudar. "auto" trataria
# qualquer async def como teste async (mais implícito, mesmo efeito prático).
asyncio_mode = strict
# Explícito para silenciar o PytestDeprecationWarning e fixar o futuro padrão
# do pytest-asyncio (loop por função para fixtures assíncronas).
asyncio_default_fixture_loop_scope = function